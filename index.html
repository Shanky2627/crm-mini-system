<!DOCTYPE html>
<html>
<head>
  <title>CRM Mini System</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="container">
    <h1>CRM Mini System</h1>

    <!-- DASHBOARD -->
    <div class="dashboard">
      <div id="total"></div>
      <div id="new"></div>
      <div id="working"></div>
      <div id="converted"></div>
    </div>

    <!-- FORM -->
    <div class="form">
      <input id="name" placeholder="Lead Name">
      <input id="email" placeholder="Email">

      <select id="status">
        <option>New</option>
        <option>Working</option>
        <option>Converted</option>
      </select>

      <button onclick="addLead()">Add Lead</button>
    </div>

    <!-- SEARCH -->
    <input id="search" placeholder="Search leads..." onkeyup="renderLeads()">

    <!-- TABLE -->
    <table>
      <thead>
        <tr>
          <th>Name</th>
          <th>Email</th>
          <th>Status</th>
          <th>Action</th>
        </tr>
      </thead>

      <tbody id="leadTable"></tbody>
    </table>
  </div>

  <script src="app.js"></script>
</body>
</html>
